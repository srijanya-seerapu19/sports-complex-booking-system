spring.application.name=sports-complex-booking-system
server.port=${PORT:8080}

# Primary Database Connection (Local MySQL / TiDB Cloud / Aiven)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sports_complex_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.keepalive-time=30000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Timezone & Serialization
spring.jackson.time-zone=UTC

# Session Cookie Security (Configured via env for local HTTP vs Render HTTPS)
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
